<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Date</title>
</head>
<body>
    <h1>Date Object</h1>

<p>Graduation is in <span id="weeks"></span> weeks, <span id="days"></span> days, <span id="hours"></span> hours, <span id="minutes"></span> minutes, and <span id="seconds"></span> seconds.</p>
</body>

<script>
    count();
    setInterval(count, 500);


    function count() {
        let now = new Date();
        console.log("NOW: " + now);

        let then = new Date("6/12/26 10:00:00");
        console.log("THEN: " + then);

        console.log((then - now) / 1000 / 60 / 60 / 24)
        let difference = then - now
        // let days = difference / 1000 / 60 / 60 / 24;
        let weeks = Math.floor(difference / (1000 * 60 * 60 * 24 * 7));
        let days = Math.floor(difference / (1000 * 60 * 60 * 24)) % 7;
        let hours = Math.floor(difference / (1000 * 60 * 60)) % 24;
        let minutes = Math.floor(difference / (1000 * 60)) % 60;
        let seconds = Math.floor(difference / (1000)) % 60;

        document.getElementById("weeks").innerHTML = weeks;
        document.getElementById("days").innerHTML = days;
        document.getElementById("hours").innerHTML = hours;
        document.getElementById("minutes").innerHTML = minutes;
        document.getElementById("seconds").innerHTML = seconds;
    }

</script>

</html>
